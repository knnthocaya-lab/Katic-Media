<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Katic Media · Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--ln:#d2d2d7;--ac:#0071e3}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#161618;--tx:#f5f5f7;--mu:#a1a1a6;--ln:#2c2c2e;--ac:#2997ff}}
*{box-sizing:border-box;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
input,select,button{font:inherit;color:inherit}input,select{padding:12px 14px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);max-width:100%}
button{cursor:pointer;border:0;border-radius:99px;padding:10px 18px;background:var(--ac);color:#fff}button.g{background:none;color:var(--ac)}
.box{max-width:380px;margin:12vh auto;padding:30px;background:var(--card);border-radius:24px;display:grid;gap:12px}h1{font-size:26px;letter-spacing:-.03em}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--ln);padding:12px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:5}
nav{display:flex;gap:6px}nav button{background:none;color:var(--mu)}nav button.on{background:var(--tx);color:var(--bg)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}.c{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}small,.m{color:var(--mu);font-size:13px}a{color:var(--ac)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}.gal>div{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:12px}
.gal img,.gal video{width:100%;height:100%;object-fit:cover}.gal button{position:absolute;top:6px;right:6px;padding:4px 9px;background:#000a;font-size:12px}
[hidden]{display:none!important}
</style></head><body>
<div id="login" class="box"><h1>Katic Media admin</h1><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="li">Sign in</button><p class="m" id="lm"></p></div>
<div id="app" hidden>
<header><b>Katic Media admin</b><nav><button data-t="orders" class="on">Orders</button><button data-t="leads">Leads</button><button data-t="files">Project files</button></nav><button class="g" id="lo">Sign out</button></header>
<main>
<section id="orders"></section><section id="leads" hidden></section>
<section id="files" hidden>
 <div class="c"><div class="r" style="justify-content:flex-start"><select id="cs"></select><select id="ss"></select><input type="file" id="fi" multiple accept="image/*,video/mp4,video/webm,application/pdf"><button id="up">Upload</button></div><p class="m" id="um" style="margin-top:8px">Pick a client and service, choose files, then Upload. They appear in that client's popup on the site.</p><div class="gal" id="fl"></div></div>
</section></main></div>
<script>
/* Paste the same Project URL and anon key you used in index.html */
const CFG={sbUrl:'https://pzwngmvrvdsxbopbxbpo.supabase.co',sbKey:'sb_publishable_aBCsv90Z31D2sFxUjKDOYQ_vtt1G4E8'};
const CLIENTS=[["cafa", "Cafa Treats"], ["adis", "Adi's Spot"], ["kersburg", "Kersburg"], ["accentuate", "Accentuate Health Tech"], ["wolbrin", "Wolbrin Pharma Limited"], ["mic", "MIC Diabetes Foundation"], ["nyero", "Nyero Foundation"], ["crafted", "Crafted in Christ"], ["banking", "Banking On It"], ["lamcon", "Lamcon Investment Ltd"], ["rentcare", "RentCare"], ["idb", "iDB Consults Ltd."], ["emrich", "Emrich Consultants"], ["davema", "Davema"], ["nasho", "Nasho Computers"], ["wonderworld", "Wonderworld Enterprises"], ["lamaro", "Lamaro Studio"], ["aol", "AOL Fashions"], ["usafe", "USAFE"], ["meteor", "Meteor Solutions Limited"], ["daluo", "Da Luo Pride"], ["weng", "Weng Gadgets"], ["doona", "Doona"], ["kumalo", "Kumalo Sports"]],SERVICES=["Branding", "Digital marketing", "Websites", "Content", "Campaigns", "Advisory & training"],STATUS={new:'Received',confirmed:'Confirmed',in_production:'In production',ready:'Ready for pickup',delivered:'Delivered',cancelled:'Cancelled'};
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=CFG.sbUrl&&window.supabase?supabase.createClient(CFG.sbUrl,CFG.sbKey):null;
if(!sb)$('#lm').textContent='Add your Supabase URL and anon key at the top of this file.';
const show=b=>{$('#login').hidden=b;$('#app').hidden=!b};
async function boot(){if(!sb)return;const{data:{session}}=await sb.auth.getSession();if(!session)return show(false);
 const{data}=await sb.from('admins').select('user_id').maybeSingle();
 if(!data){await sb.auth.signOut();$('#lm').textContent='This account is not an admin yet. Add it to the admins table.';return show(false)}
 show(true);loadOrders()}
$('#li').onclick=async()=>{if(!sb)return;const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#lm').textContent=error.message;else boot()};
$('#lo').onclick=async()=>{await sb.auth.signOut();show(false)};
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b==e.target));['orders','leads','files'].forEach(x=>$('#'+x).hidden=x!=t);({orders:loadOrders,leads:loadLeads,files:loadFiles})[t]()};
const wa=p=>{let d=String(p).replace(/\D/g,'');if(d.startsWith('0'))d='256'+d.slice(1);return 'https://wa.me/'+d};
async function loadOrders(){const{data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200);
 $('#orders').innerHTML=error?'<p class="m">'+esc(error.message)+'</p>':(data.length?data.map(o=>`<div class="c"><div class="r"><div><b>${esc(o.ref)}</b> <small>${new Date(o.created_at).toLocaleString()}</small><br>${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · <a href="${wa(o.phone)}" target="_blank" rel="noopener">WhatsApp</a></div><select data-id="${o.id}">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k==o.status?'selected':''}>${v}</option>`).join('')}</select></div><p class="m" style="margin-top:8px">${(o.items||[]).map(i=>`${i.qty} × ${esc(i.name)} (${esc(i.size)})`).join(', ')} · <b style="color:var(--tx)">UGX ${Number(o.total).toLocaleString()}</b></p></div>`).join(''):'<p class="m">No orders yet.</p>')}
$('#orders').onchange=async e=>{const id=e.target.dataset.id;if(!id)return;const{error}=await sb.from('orders').update({status:e.target.value}).eq('id',id);e.target.style.outline=error?'2px solid red':'2px solid #30d158';setTimeout(()=>e.target.style.outline='',1200)};
async function loadLeads(){const{data,error}=await sb.from('leads').select('*').order('created_at',{ascending:false}).limit(200);
 $('#leads').innerHTML=error?'<p class="m">'+esc(error.message)+'</p>':(data.length?data.map(l=>`<div class="c"><div class="r"><b>${l.kind=='contact'?'Message':'Needs assessment'} · ${esc(l.name||'Visitor')}</b><small>${new Date(l.created_at).toLocaleString()}</small></div><p class="m">${esc(l.contact||'')}</p>${l.message?'<p>'+esc(l.message)+'</p>':''}${l.data?'<p class="m" style="margin-top:6px">'+Object.entries(l.data).filter(([k])=>!['name','contact','biz'].includes(k)).map(([k,v])=>esc(k)+': '+esc([].concat(v).join(', '))).join('<br>')+'</p>':''}</div>`).join(''):'<p class="m">No leads yet.</p>')}
$('#cs').innerHTML=CLIENTS.map(c=>`<option value="${c[0]}">${esc(c[1])}</option>`).join('');$('#ss').innerHTML=SERVICES.map(s=>`<option>${s}</option>`).join('');
$('#cs').onchange=$('#ss').onchange=()=>loadFiles();
const kind=u=>/\.(mp4|webm|mov)$/i.test(u)?'v':/\.pdf$/i.test(u)?'p':'i';
async function loadFiles(){const{data}=await sb.from('project_files').select('*').eq('client_key',$('#cs').value).eq('service',$('#ss').value).order('created_at');
 $('#fl').innerHTML=(data||[]).map(f=>`<div>${{v:`<video src="${esc(f.url)}#t=0.5" muted></video>`,p:'PDF',i:`<img src="${esc(f.url)}" alt="" loading="lazy">`}[kind(f.url)]}<button data-id="${f.id}" data-p="${esc(f.path||'')}">Delete</button></div>`).join('')||'<small>No files yet for this client and service.</small>'}
$('#fl').onclick=async e=>{const id=e.target.dataset.id;if(!id||!confirm('Delete this file?'))return;if(e.target.dataset.p)await sb.storage.from('work').remove([e.target.dataset.p]);await sb.from('project_files').delete().eq('id',id);loadFiles()};
async function shrink(f){if(!f.type.startsWith('image/')||/svg|gif/.test(f.type))return f;const bm=await createImageBitmap(f),k=Math.min(1,1800/Math.max(bm.width,bm.height));if(k==1&&f.size<1.5e6)return f;const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(b=>r(new File([b],f.name.replace(/\.\w+$/,'')+'.webp',{type:'image/webp'})),'image/webp',.85))}
$('#up').onclick=async()=>{const fs=[...$('#fi').files],cl=$('#cs').value,sv=$('#ss').value;if(!fs.length)return $('#um').textContent='Choose one or more files first.';
 let ok=0;for(const f0 of fs){$('#um').textContent=`Uploading ${ok+1} of ${fs.length}…`;const f=await shrink(f0),path=`${cl}/${sv.toLowerCase().replace(/\W+/g,'-')}/${Date.now()}-${f.name.replace(/[^\w.-]+/g,'_')}`;
  const up=await sb.storage.from('work').upload(path,f,{contentType:f.type});if(up.error){$('#um').textContent='Upload failed: '+up.error.message;return}
  const url=sb.storage.from('work').getPublicUrl(path).data.publicUrl;await sb.from('project_files').insert({client_key:cl,service:sv,url,path,name:f0.name});ok++}
 $('#um').textContent=`Done. ${ok} file${ok>1?'s':''} uploaded.`;$('#fi').value='';loadFiles()};
boot();
</script></body></html>
